# Configuration for Speech to Text Remote Service

# Service registration timeout in seconds.
# When no services are available (remoteServices list is null or empty), this defines
# how long to wait before timing out. This timeout ONLY applies when services have
# NEVER been registered. If services were registered at least once but are currently
# busy (e.g., running jobs), the system will wait indefinitely for them to become available.
#
# Default: -1 (wait indefinitely)
# Set to a positive value to enable timeout (e.g., 300 for 5 minutes)
#org.opencastproject.serviceregistry.remote.registration.timeout=-1