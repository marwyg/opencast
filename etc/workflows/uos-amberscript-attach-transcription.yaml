---
id: uos-amberscript-attach-transcription
title: Attach caption/transcripts generated by AmberScript
description: Attach transcription generated by the AmberScript service.
             This is an internal workflow, started by the Transcription Service.

operations:

  - id: amberscript-attach-transcription
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: Attach captions/transcription
    configurations:
      - transcription-job-id: ${transcriptionJobId}
      - target-caption-format: vtt
      - target-flavor: captions/source

  - id: snapshot
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: Archive media package
    configurations:
      - source-flavors: "*/*"

  # Cut the subtitles
  - id: editor
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: Cutting the subtitles according to the edit decision list
    configurations:
      - source-flavors: captions/source
      - smil-flavors: smil/cutting
      - target-smil-flavor: smil/cutting
      - target-flavor-subtype: delivery
      - interactive: false

  - id: publish-engage
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: Distribute and publish to engage server
    configurations:
      - download-source-flavors: "dublincore/*,security/*,captions/delivery"
      - download-source-tags: engage-download
      - strategy: merge
      - check-availability: false

  - id: cleanup
    fail-on-error: false
    description: Remove temporary processing artifacts
    configurations:
      - delete-external: false
      - preserve-flavors: "security/*"
